<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Página no encontrada — Benjamin De Paolo</title>
  <style>
    :root{color-scheme:light dark;--bg:#fff;--ink:#20252b;--muted:#596068;--line:#e7e7e7}
    @media(prefers-color-scheme:dark){:root{--bg:#111;--ink:#ededed;--muted:#aaa;--line:#2b2b2b}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:672px;margin:auto;padding:40px 22px}header a{font-weight:600;text-decoration:none}a{color:inherit;text-underline-offset:5px}a:focus-visible{outline:2px solid currentColor;outline-offset:5px}
    main{padding:80px 0;border-bottom:1px solid var(--line)}.code{color:var(--muted);font-size:14px}h1{font-size:30px;line-height:1.25;letter-spacing:-1px}p{color:var(--muted)}.back{display:inline-block;margin-top:20px}
  </style>
</head>
<body>
  <div class="wrap">
    <header><a href="/">Benjamin De Paolo</a></header>
    <main>
      <p class="code">Error 404</p>
      <h1>Esta página no existe</h1>
      <p>Puede que el enlace haya cambiado o esté mal escrito.</p>
      <a class="back" href="/">← Volver al inicio</a>
    </main>
  </div>
</body>
</html>
